<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CasePlanr</title>
    <script>
      (() => {
        const palette = localStorage.getItem('paletteColor');
        const allowed = ['orange', 'blue', 'red', 'green', 'purple', 'neutral'];
        document.documentElement.dataset.palette = allowed.includes(palette) ? palette : 'blue';

        const preference = localStorage.getItem('themePreference');
        const storedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark =
          preference === 'dark' ||
          (preference === 'light' ? false : preference === 'system' ? prefersDark : storedTheme === 'dark' || (!storedTheme && prefersDark));
        document.documentElement.classList.toggle('dark', isDark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
